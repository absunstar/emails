<div id="addEmailModal" class="modal" hidden>
    <div class="modal-content">
        <div class="modal-header"><h2>##word.emails_add##</h2><button class="sb-modal-close" type="button" data-modal-close="#addEmailModal">×</button></div>
        <div class="modal-body">
            <form data-send-form class="sb-form-grid">
                <div class="sb-field"><label>##word.From##</label><input class="sb-input" name="from" type="email" required /></div>
                <div class="sb-field"><label>##word.To##</label><input class="sb-input" name="to" type="text" required /></div>
                <div class="sb-field wide"><label>##word.Subject##</label><input class="sb-input" name="subject" type="text" required /></div>
                <div class="sb-field wide"><label>Text Message</label><textarea class="sb-textarea" name="text"></textarea></div>
                <div class="sb-field wide"><label>##word.HTML Message##</label><textarea class="sb-textarea" name="html"></textarea></div>
            </form>
            <div class="sb-status" data-send-error></div>
        </div>
        <div class="modal-footer"><button class="sb-btn sb-btn-ghost" type="button" data-modal-close="#addEmailModal"><svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg><span>##word.close##</span></button><button class="sb-btn sb-btn-success" type="button" data-action="send-email"><svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4 20-7Z"></path></svg><span>##word.add##</span></button></div>
    </div>
</div>
