<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#dbeafe;font-family:Arial,sans-serif}.box{width:min(460px,calc(100% - 32px));padding:30px;border:1px solid #223a59;border-radius:18px;background:#0d1829;box-shadow:0 22px 70px rgba(0,0,0,.28)}h1{margin:0 0 8px;color:#fff;font-size:26px}p{margin:0 0 22px;color:#91a9c5;line-height:1.6}.field{display:grid;gap:7px;margin-bottom:13px}.field span{font-size:12px;color:#9fb4ca;font-weight:700}.field input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #315477;border-radius:10px;background:#081523;color:#fff;outline:none}.field input:focus{border-color:#38bdf8}.actions{display:grid;gap:9px;margin-top:18px}.btn{min-height:44px;border:1px solid #315477;border-radius:10px;background:#15263c;color:#dff3ff;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn.primary{border-color:#278ed2;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff}.error{min-height:20px;margin-top:12px;color:#ff9a9a;font-size:12px;text-align:center}.divider{display:flex;align-items:center;gap:10px;margin:17px 0;color:#647d97;font-size:11px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#223a59}
</style>
</head>
<body>
<main class="box">
<h1>Mail Admin</h1>
<p>Sign in with the local administrator account configured for this mail instance.</p>
<form id="adminLoginForm">
<label class="field"><span>Username</span><input name="username" autocomplete="username" value="admin" required></label>
<label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
<div class="actions"><button class="btn primary" type="submit">Login</button></div>
</form>
<div class="error" id="adminLoginError"></div>
<div class="divider">OR</div>
<div class="actions">
<a class="btn" href="/login?next=%2Fadmin">Login by Social Browser</a>
<a class="btn" href="/">Back</a>
</div>
</main>
<script>
(function(){const form=document.getElementById('adminLoginForm'),error=document.getElementById('adminLoginError');form.addEventListener('submit',async function(e){e.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;try{const data=Object.fromEntries(new FormData(form).entries());const r=await fetch('/api/v2/admin-auth/signin',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!j.done)throw new Error(j.error||'Login failed');const next=new URLSearchParams(location.search).get('next');location.assign(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/admin');}catch(err){error.textContent=err.message||'Login failed';}finally{button.disabled=false;}})})();
</script>
</body>
</html>
