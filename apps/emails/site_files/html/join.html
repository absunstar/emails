<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Join organization</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#dbeafe;font-family:Arial,sans-serif;padding:24px}.card{width:min(560px,100%);padding:30px;border:1px solid #223a59;border-radius:18px;background:#0d1829;box-shadow:0 22px 70px rgba(0,0,0,.28)}.brand{font-size:13px;color:#69c7ff;font-weight:800;letter-spacing:.08em}.card h1{margin:8px 0 10px;color:#fff}.card p{color:#91a9c5;line-height:1.65}.status{margin:18px 0;padding:13px 14px;border-radius:11px;background:#101f33;color:#bdd7ef}.status.error{background:#32151a;color:#ffc8cc}.status.success{background:#10271e;color:#baf3d0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #315477;border-radius:11px;background:#15263c;color:#dff3ff;min-height:44px;padding:0 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{border-color:#278ed2;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:white}.btn[disabled]{opacity:.55;cursor:not-allowed}code{word-break:break-all;color:#8bdcff}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand" data-product>MAIL PLATFORM</div>
    <h1>Join organization</h1>
    <p>This invitation binds your current Social Browser identity to the organization and role selected by its administrator.</p>
    <div class="status" data-status>Checking your invitation and Social Browser session…</div>
    <div class="actions">
      <button class="btn primary" type="button" data-accept hidden>Accept invitation</button>
      <a class="btn primary" data-login hidden>Sign in with Social Browser</a>
      <a class="btn" href="/">Back</a>
    </div>
  </main>
  <script src="/js/join.js"></script>
</body>
</html>
